name: Ambaro Android app

# Builds the Royal Club Android app (APK) in the cloud, so no Android Studio is needed.
# Two APKs come out of every run (download them from the run's "Artifacts" section):
#   RoyalClub-test.apk    – opens test.royalclubgames.com, so every game change shows up without a new APK.
#   RoyalClub-offline.apk – the games are packaged inside the app (works offline); this is the shape of the Play Store app.
# The chatgpt-design branch uses a separate package id so its APK can sit beside the existing Ambaro app.
#   RoyalClub-play.aab    – the Play Store bundle (games packaged inside), signed with the upload key from the
#                           repository secrets. Upload it in Play Console. Built only when those secrets exist.

on:
  push:
    branches: [main, chatgpt-design]
    paths:
      - "web/**"
      - ".github/workflows/android-app.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

permissions:
  contents: write   # to publish the test APK on the "test-app" release page

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Public values only (the same ones the website uses). Repository variables override them when set.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://cveqalxcpenkncahnexd.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_o89SjkD_5i4ay4JdKhVydw_VzNWbi8G' }}
      VITE_ROOM_SERVER_URL: ${{ vars.VITE_ROOM_SERVER_URL || 'wss://royal-club-rooms.ravi-nadimpalli-teja.workers.dev' }}
      TEST_SITE_URL: ${{ vars.TEST_SITE_URL || 'https://test.royalclubgames.com' }}
      ANDROID_APP_NAME: ${{ github.ref == 'refs/heads/chatgpt-design' && 'Ambaro Playhouse' || 'Ambaro' }}
      ANDROID_APP_ID: ${{ github.ref == 'refs/heads/chatgpt-design' && 'com.royalclubgames.chatgptdesign' || 'com.royalclubgames.app' }}
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 != '' && github.ref != 'refs/heads/chatgpt-design' }}
      # Crash reports (Firebase Crashlytics) are added only when the GOOGLE_SERVICES_JSON secret holds the
      # google-services.json file from the Firebase project (Android app id com.royalclubgames.app).
      HAS_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON != '' && github.ref != 'refs/heads/chatgpt-design' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install and build the website
        run: |
          npm install
          # The commit this code comes from: live updates compare it with the published version.
          BUNDLE_VERSION="${GITHUB_SHA::7}" npm run build

      - name: Create the Android project
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ "$HAS_FIREBASE" = "true" ]; then npm install --no-save @capacitor-firebase/crashlytics@^8; fi
          npx cap add android
          # Dark night-green behind the status and navigation bars (the app keeps every screen between them),
          # instead of the default white window.
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources><color name="rc_bars">#06140F</color></resources>' > android/app/src/main/res/values/rc_colors.xml
          sed -i 's#<item name="windowNoTitle">true</item>#<item name="windowNoTitle">true</item>\n        <item name="android:windowBackground">@color/rc_bars</item>#' android/app/src/main/res/values/styles.xml
          grep -n "windowBackground" android/app/src/main/res/values/styles.xml || echo "note: windowBackground not added (template changed)"
          # Google sign-in comes back into the app through com.royalclubgames.app://auth-callback (src/auth/account.ts).
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          f = ('\n            <intent-filter>\n'
               '                <action android:name="android.intent.action.VIEW" />\n'
               '                <category android:name="android.intent.category.DEFAULT" />\n'
               '                <category android:name="android.intent.category.BROWSABLE" />\n'
               '                <data android:scheme="com.royalclubgames.app" android:host="auth-callback" />\n'
               '            </intent-filter>\n        ')
          if 'auth-callback' not in s:
              i = s.index('</activity>')
              s = s[:i] + f + s[i:]
              open(p, 'w').write(s)
          PY
          grep -n "auth-callback" android/app/src/main/AndroidManifest.xml || { echo "the sign-in app link was not added"; exit 1; }
          if [ "$HAS_FIREBASE" = "true" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            # Crashlytics Gradle plugin (the Google Services plugin is already in Capacitor's project and is applied
            # automatically when google-services.json exists).
            sed -i "/com.google.gms:google-services/a\\        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.2'" android/build.gradle
            echo "apply plugin: 'com.google.firebase.crashlytics'" >> android/app/build.gradle
            grep -n "crashlytics\|google-services" android/build.gradle android/app/build.gradle
          fi
          # The Playhouse gets its own launcher/splash emblem; the official Ambaro wordmark inside the app stays as-is.
          if [ "$GITHUB_REF" = "refs/heads/chatgpt-design" ]; then
            mkdir -p playhouse-assets
            cp assets/playhouse-icon.svg playhouse-assets/logo.svg
            npx --yes @capacitor/assets@3 generate --android --assetPath playhouse-assets \
              --iconBackgroundColor '#06392C' --iconBackgroundColorDark '#06392C' \
              --splashBackgroundColor '#05271F' --splashBackgroundColorDark '#05271F'
          else
            npx --yes @capacitor/assets@3 generate --android \
              --iconBackgroundColor '#0F4D3A' --iconBackgroundColorDark '#0F4D3A' \
              --splashBackgroundColor '#0B3B2D' --splashBackgroundColorDark '#0B3B2D'
          fi
          # Each build gets a higher version number, so a new APK installs over the old one.
          sed -i -E "s/versionCode( =)? [0-9]+/versionCode\\1 ${{ github.run_number }}/; s/versionName( =)? \"[^\"]+\"/versionName\\1 \"0.1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName|targetSdk" android/app/build.gradle android/variables.gradle || true
          # Same signing key on every build (see web/app-signing/README.md).
          mkdir -p ~/.android
          cp app-signing/test.keystore ~/.android/debug.keystore
          mkdir -p ../apk

      - name: Build the offline APK (games packaged inside)
        run: |
          npx cap sync android
          (cd android && ./gradlew --no-daemon assembleDebug)
          cp android/app/build/outputs/apk/debug/app-debug.apk ../apk/RoyalClub-offline.apk

      - name: Build the Play Store bundle (AAB, games packaged inside)
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          npx cap sync android
          (cd android && ./gradlew --no-daemon bundleRelease)
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$UPLOAD_STORE_PASSWORD" -keypass "$UPLOAD_KEY_PASSWORD" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            android/app/build/outputs/bundle/release/app-release.aab "$UPLOAD_KEY_ALIAS"
          rm -f "$RUNNER_TEMP/upload.jks"
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab | tail -1
          cp android/app/build/outputs/bundle/release/app-release.aab ../apk/RoyalClub-play.aab

      - name: Build the test APK (opens the test site)
        run: |
          CAP_SERVER_URL="$TEST_SITE_URL" npx cap sync android
          (cd android && ./gradlew --no-daemon assembleDebug)
          cp android/app/build/outputs/apk/debug/app-debug.apk ../apk/RoyalClub-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'chatgpt-design' && 'Ambaro-ChatGPT-Design-test-apk' || 'RoyalClub-test-apk' }}
          path: apk/RoyalClub-test.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'chatgpt-design' && 'Ambaro-ChatGPT-Design-offline-apk' || 'RoyalClub-offline-apk' }}
          path: apk/RoyalClub-offline.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: RoyalClub-play-aab
          path: apk/RoyalClub-play.aab
          retention-days: 90

      # Fixed phone-friendly link (no GitHub sign-in needed):
      # https://github.com/<owner>/<repo>/releases/download/test-app/RoyalClub-test.apk
      - name: Publish the test APK to the "test-app" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'   # only main updates the shared link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view test-app >/dev/null 2>&1 || gh release create test-app --prerelease --title "Ambaro test app" \
            --notes "Latest test build of the Ambaro Android app. Install RoyalClub-test.apk on your phone."
          gh release upload test-app ../apk/RoyalClub-test.apk ../apk/RoyalClub-offline.apk --clobber
