<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Word Puzzle — Ambaro</title>
<link rel="icon" href="../brand/ambaro-elephant.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Cinzel:wght@700;800&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--dark:#072A20;--mid:#0B3B2D;--light:#1B6B50;--gold:#E9C46A;--gold-d:#B8862B;--saffron:#F28C28;--saffron-d:#B85D0B;--ink:#2A1605;--ivory:#FFF8EA;--lotus:#E36A8C;--maroon:#4A0510}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--ivory);overflow:hidden;background:var(--dark);user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:12px}
.stage{position:fixed;inset:0;display:flex;justify-content:center;
  background:
   repeating-conic-gradient(from 0deg at 50% -8%,rgba(233,196,106,.07) 0 6deg,transparent 6deg 15deg),
   radial-gradient(120% 60% at 50% -5%,rgba(52,160,118,.55),transparent 62%),
   linear-gradient(180deg,var(--light) -30%,var(--mid) 35%,var(--dark) 100%)}
.stage::before{content:"";position:absolute;inset:0;opacity:.06;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,transparent 9px,var(--gold) 9.5px 10.5px,transparent 11px) 0 0/28px 28px,
             radial-gradient(circle at 0 0,transparent 9px,var(--gold) 9.5px 10.5px,transparent 11px) 0 0/28px 28px}
.stage[hidden]{display:none}
.col{position:relative;width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* shared bits */
.bar{display:flex;align-items:center;gap:10px;padding:12px 14px 4px}
.gbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 1.5px rgba(233,196,106,.55);flex:none}
.gbtn svg{width:22px;height:22px}
.where{flex:1;text-align:center;line-height:1.05;min-width:0}
.where b{display:block;font-size:22px;font-weight:800}
.where span{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;color:var(--gold)}
.coin{display:flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 4px;border-radius:99px;background:rgba(0,0,0,.32);box-shadow:inset 0 0 0 1.5px rgba(233,196,106,.55);font-weight:800;font-size:18px;flex:none}
.coin svg{width:32px;height:32px}
.coin.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.14)}}
.toast{position:fixed;left:50%;top:92px;transform:translate(-50%,-8px);opacity:0;z-index:80;pointer-events:none;transition:.2s;
  font-family:'DM Sans',sans-serif;font-weight:700;font-size:15px;color:var(--ink);background:var(--ivory);padding:9px 16px;border-radius:14px;box-shadow:0 0 0 2px var(--gold),0 8px 20px rgba(0,0,0,.35);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- map ---------- */
.mapTop{display:flex;align-items:center;gap:10px;padding:12px 14px 6px}
.mapTop .where{text-align:left}
.daily{display:flex;align-items:center;gap:12px;margin:6px 14px 8px;padding:10px 12px;border-radius:18px;color:var(--ink);
  background:linear-gradient(180deg,#FFFDF6,#F7EAD0);box-shadow:inset 0 0 0 2px var(--gold),0 6px 0 rgba(0,0,0,.25)}
.daily .t{display:flex;gap:3px}
.daily .t i{width:18px;height:20px;border-radius:5px;background:#1B6B50}
.daily .t i:nth-child(2){background:var(--gold)}.daily .t i:nth-child(4){background:#c8cfc9}
.daily div.tx{flex:1;line-height:1.1}
.daily b{font-size:17px}
.daily small{display:block;font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:500;color:#6B5A3E}
.pill{height:40px;padding:0 18px;border-radius:20px;font-weight:800;font-size:17px;color:var(--ink);background:linear-gradient(180deg,#FFB85C,#F28C28 55%,#D9701A);box-shadow:0 4px 0 #8A4207,inset 0 2px 0 rgba(255,255,255,.35)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;padding-bottom:20px}
.soon{text-align:center;font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:500;color:rgba(255,248,234,.7);padding:18px 30px 4px}
.world{display:flex;flex-direction:column-reverse}
.wband{position:relative;margin:4px 14px 6px;height:64px;border-radius:18px;overflow:hidden;display:flex;align-items:center;gap:12px;padding:0 16px;
  background:linear-gradient(100deg,var(--wc),var(--wcd));box-shadow:inset 0 0 0 2px rgba(233,196,106,.65),0 6px 0 rgba(0,0,0,.28)}
.wband::after{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 88% 50%,rgba(255,255,255,.10) 0 7deg,transparent 7deg 16deg);pointer-events:none}
.wband .em{font-size:34px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.wband b{flex:1;font-size:21px;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.wband span{display:flex;align-items:center;gap:4px;font-weight:800;font-size:16px;position:relative;z-index:1}
.wband span svg{width:20px;height:20px}
.world.locked .wband{filter:saturate(.25) brightness(.7)}
.path{position:relative}
.path svg.road{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;display:grid;place-items:center;font-size:25px;font-weight:800;color:var(--ink);
  background:radial-gradient(circle at 50% 32%,#FFFFFF,#FFF3D6 58%,#E8CF98);box-shadow:0 5px 0 #A9874A,0 9px 14px rgba(0,0,0,.35),inset 0 0 0 3px rgba(233,196,106,.85)}
.node.locked{background:radial-gradient(circle at 50% 32%,#3D5E53,#22413A);box-shadow:0 5px 0 #13291F,inset 0 0 0 2px rgba(233,196,106,.25);color:transparent}
.node.locked svg{width:24px;height:24px}
.node.current{background:radial-gradient(circle at 50% 32%,#FFD08A,#F28C28 70%);color:#fff;box-shadow:0 5px 0 #B85D0B,0 0 0 4px rgba(255,226,154,.85),0 0 24px rgba(242,140,40,.7)}
.node.current::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid rgba(255,226,154,.9);animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(.88);opacity:1}to{transform:scale(1.3);opacity:0}}
.node .st{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);display:flex;gap:1px}
.node .st svg{width:18px;height:18px}
.node .st svg.off{filter:grayscale(1) brightness(.45);opacity:.6}
.node .nm{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:14px;font-weight:700;color:var(--ivory);white-space:nowrap;text-shadow:0 2px 3px rgba(0,0,0,.5)}
.gift{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;display:grid;place-items:center}
.gift svg{width:58px;height:58px;filter:drop-shadow(0 5px 0 rgba(0,0,0,.3))}
.gift.done svg{filter:grayscale(.6) brightness(.8)}

/* ---------- level ---------- */
.prog{display:flex;justify-content:center;align-items:center;gap:7px;margin:2px 0 0;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;color:rgba(255,248,234,.85)}
.prog i{width:20px;height:6px;border-radius:3px;background:rgba(255,248,234,.18);transition:background .3s}
.prog i.on{background:linear-gradient(90deg,var(--gold),#FFE29A)}
.trayWrap{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 14px;min-height:0;position:relative}
.tray{position:relative;padding:12px;border-radius:22px;background:linear-gradient(180deg,rgba(0,0,0,.30),rgba(0,0,0,.18));
  box-shadow:inset 0 0 0 2px rgba(233,196,106,.55),inset 0 0 0 6px rgba(0,0,0,.15),inset 0 0 0 7.5px rgba(233,196,106,.25),0 14px 30px rgba(0,0,0,.25)}
.grid{position:relative}
.cell{position:absolute;border-radius:22%;display:grid;place-items:center;font-weight:800;color:var(--ink);text-transform:uppercase;line-height:1;
  background:rgba(0,0,0,.32);box-shadow:inset 0 3px 6px rgba(0,0,0,.45),inset 0 -1px 0 rgba(233,196,106,.18);transition:background .2s}
.cell span{opacity:0;transform:scale(.4)}
.cell.on{background:linear-gradient(180deg,#FFFDF6,#F5E6C3);box-shadow:0 4px 0 #C9A86A,0 6px 10px rgba(0,0,0,.3),inset 0 1px 0 #fff}
.cell.on span{opacity:1;transform:none;transition:transform .28s cubic-bezier(.2,1.6,.4,1),opacity .12s}
.cell.hint{background:linear-gradient(180deg,#FFE7B8,#F6C977);box-shadow:0 4px 0 #B8862B;color:#8A4207}
.cell.hint span{opacity:1;transform:none}
.cell.glow{box-shadow:0 4px 0 #C9A86A,0 0 0 3px #FFE29A,0 0 18px rgba(255,226,154,.85)}
.cell.again{animation:again .5s}
@keyframes again{30%{transform:scale(1.12)}}
.praise{position:absolute;left:50%;top:9%;z-index:6;pointer-events:none;font-family:'Cinzel',serif;font-weight:800;font-size:40px;letter-spacing:.04em;white-space:nowrap;
  background:linear-gradient(180deg,#FFF3C0,#E6BD5F 55%,#A87A24);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.45)) drop-shadow(0 0 12px rgba(255,214,102,.5));animation:praise 1.1s ease forwards}
@keyframes praise{0%{transform:translate(-50%,-30%) scale(.4) rotate(-6deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.1) rotate(-3deg);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-90%) scale(1) rotate(-3deg);opacity:0}}
.bubble{height:54px;display:flex;justify-content:center;align-items:center}
.bubble span{display:flex;gap:4px;padding:5px 8px;border-radius:15px;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 1.5px rgba(233,196,106,.6)}
.bubble span:empty{display:none}
.bubble b,.flyer{width:32px;height:38px;border-radius:8px;display:grid;place-items:center;font-size:25px;font-weight:800;color:var(--ink);text-transform:uppercase;
  background:linear-gradient(180deg,#FFFDF6,#F5E6C3);box-shadow:0 3px 0 #C9A86A}
.bubble span.bad{animation:shake .35s}
.bubble span.dup b{background:linear-gradient(180deg,#e9ecea,#cfd6d2);box-shadow:0 3px 0 #98a39d}
@keyframes shake{25%,75%{transform:translateX(-7px)}50%{transform:translateX(7px)}}
.flyer{position:fixed;z-index:60;pointer-events:none;transition:transform .42s cubic-bezier(.4,.1,.2,1),width .42s,height .42s,opacity .2s}
.deck{position:relative;display:flex;justify-content:center;padding:2px 0 18px}
.plate{position:relative;border-radius:50%;touch-action:none;
  background:radial-gradient(circle at 50% 38%,#FFE9A8 0,#E9C46A 34%,#B8862B 70%,#7A5512 100%);
  box-shadow:0 9px 0 #5E3F0C,0 16px 28px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.6)}
.plate::before{content:"";position:absolute;inset:4.4%;border-radius:50%;border:2px dotted rgba(94,63,12,.55)}
.plate::after{content:"";position:absolute;inset:9.6%;border-radius:50%;background:radial-gradient(circle at 50% 40%,#1E7457,#0B3B2D 75%);
  box-shadow:inset 0 4px 12px rgba(0,0,0,.6),0 0 0 3px #8A6420,0 0 0 5px #F5D98C}
.plate svg.trail{position:absolute;inset:0;width:100%;height:100%;z-index:2;overflow:visible;pointer-events:none}
.tok{position:absolute;z-index:3;border-radius:50%;display:grid;place-items:center;font-weight:800;color:var(--ink);text-transform:uppercase;line-height:1;pointer-events:none;
  background:radial-gradient(circle at 50% 35%,#FFFFFF,#FFF3D6 55%,#E8CF98);box-shadow:0 5px 0 #A9874A,0 8px 12px rgba(0,0,0,.4),inset 0 0 0 3px rgba(233,196,106,.7);
  transition:left .35s ease,top .35s ease,transform .12s}
.tok.sel{background:radial-gradient(circle at 50% 35%,#FFD08A,#F28C28 70%);color:#fff;box-shadow:0 5px 0 #B85D0B,0 0 0 4px rgba(255,226,154,.9),0 0 26px rgba(242,140,40,.9);transform:scale(1.08)}
.tool{position:absolute;display:grid;justify-items:center;gap:3px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;color:rgba(255,248,234,.85)}
.tool .r{position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.30);box-shadow:inset 0 0 0 1.5px rgba(233,196,106,.6),0 4px 0 rgba(0,0,0,.25);overflow:visible}
.tool:active .r{transform:scale(.93)}
.tool .r svg{width:32px;height:32px}
.tool.shuf{left:12px;bottom:20px}.tool.hint{right:12px;bottom:20px}.tool.pot{left:12px;top:0}
.badge{position:absolute;top:-6px;right:-10px;display:flex;align-items:center;gap:2px;height:22px;padding:0 7px 0 2px;border-radius:99px;background:#2A1605;box-shadow:inset 0 0 0 1.2px var(--gold);font-size:12px;font-weight:800;color:#fff;font-family:'Baloo 2',sans-serif}
.badge svg{width:18px!important;height:18px!important}
.potin{position:absolute;inset:3px;border-radius:50%;overflow:hidden}
.potfill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#F39AB3,#E36A8C);transition:height .4s}
.potn{position:absolute;inset:0;display:grid;place-items:center;font:800 18px 'Baloo 2',sans-serif;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.hand{position:absolute;z-index:8;width:54px;height:54px;pointer-events:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))}
.tip{position:absolute;left:50%;transform:translateX(-50%);top:-36px;z-index:8;white-space:nowrap;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;color:var(--ink);background:var(--ivory);padding:6px 12px;border-radius:12px;box-shadow:0 0 0 2px var(--gold)}

/* ---------- celebrations ---------- */
.cel{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:18px;overflow:auto;
  background:radial-gradient(ellipse at 50% 40%,#6E0818,#1E0004 78%)}
.cel.show{display:flex}
.cel .in{position:relative;z-index:2;width:100%;max-width:380px;text-align:center}
.cel h1{margin:0;font-family:'Cinzel',serif;font-weight:800;font-size:clamp(34px,10vw,46px);letter-spacing:.05em;line-height:1.05;
  background:linear-gradient(180deg,#FFF3C0,#E6BD5F 55%,#A87A24);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(60,0,10,.6));animation:rise .5s ease both}
@keyframes rise{from{transform:translateY(16px) scale(.9);opacity:0}}
.cel .sub{font-family:'DM Sans',sans-serif;font-weight:700;color:#FFF8EA;font-size:16px;margin:6px 0 2px}
.stars{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:8px 0 8px;height:96px}
.stars svg{width:70px;height:70px;opacity:0;transform:scale(0) rotate(-40deg)}
.stars svg.s2{width:88px;height:88px;margin-bottom:10px}
.stars svg.in{animation:starIn .45s cubic-bezier(.2,1.6,.4,1) forwards}
.stars svg.got{filter:drop-shadow(0 4px 0 rgba(60,0,10,.5)) drop-shadow(0 0 14px rgba(255,214,102,.55))}
.stars svg.off{filter:grayscale(1) brightness(.45)}
@keyframes starIn{to{opacity:1;transform:none}}
.stars svg.off.in{animation-name:starOff}
@keyframes starOff{to{opacity:.55;transform:none}}
.earn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px 0 4px;border-radius:99px;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 1.5px var(--gold);font-size:22px;font-weight:800}
.earn svg{width:32px;height:32px}
.wcard{margin:14px 0 10px;text-align:left;padding:13px 16px;border-radius:20px;color:var(--ink);background:linear-gradient(180deg,#FFFDF6,#F7EAD0);
  box-shadow:inset 0 0 0 2px #E9C46A,inset 0 0 0 5px #FFFDF6,inset 0 0 0 6.5px rgba(184,134,43,.5),0 10px 24px rgba(0,0,0,.4)}
.wcard .tag{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;color:#1B6B50}
.wcard .w{display:flex;align-items:center;gap:10px;font-family:'Cinzel',serif;font-weight:800;font-size:28px;letter-spacing:.12em;color:#7A1426;text-transform:uppercase}
.say{width:34px;height:34px;border-radius:50%;background:#1B6B50;display:grid;place-items:center;flex:none}
.say svg{width:18px;height:18px}
.wcard p{margin:5px 0 0;font-family:'DM Sans',sans-serif;font-size:16px;line-height:1.4;font-weight:500}
.wcard .ex{color:#6B5A3E;font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:2px 0 14px}
.chips span{font-family:'DM Sans',sans-serif;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:2px 10px;border-radius:99px;background:rgba(255,248,234,.14);box-shadow:inset 0 0 0 1px rgba(233,196,106,.5)}
.chips span.b{background:rgba(227,106,140,.25);box-shadow:inset 0 0 0 1px rgba(255,170,195,.7)}
.big{display:block;width:100%;height:62px;border-radius:30px;font:800 24px/1 'Baloo 2',sans-serif;color:#2A1605;
  background:linear-gradient(180deg,#FFB85C,#F28C28 55%,#D9701A);box-shadow:0 6px 0 #8A4207,inset 0 3px 0 rgba(255,255,255,.35)}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #8A4207}
.big.gold{background:linear-gradient(180deg,#FFE29A,#F5C542 55%,#D9A72C);box-shadow:0 6px 0 #8A6420,inset 0 3px 0 rgba(255,255,255,.4)}
.quiet{display:inline-block;margin-top:12px;font-family:'DM Sans',sans-serif;font-weight:700;color:var(--gold);font-size:16px;padding:6px 10px}
canvas.petals{position:fixed;inset:0;width:100vw;height:100vh;z-index:55;pointer-events:none}
/* world finished: diyas + the Ambaro elephant walking with its ambari */
.diyas{display:flex;justify-content:center;gap:6px;margin:14px 0 4px}
.diyas svg{width:52px;height:47px}
.diyas svg .fl{opacity:0}
.diyas svg.lit .fl{opacity:1;animation:flick 1.2s ease-in-out infinite alternate;filter:drop-shadow(0 0 6px #FFB627) drop-shadow(0 0 14px rgba(255,182,39,.8))}
@keyframes flick{to{transform:scaleY(1.08) translateY(-.4px)}}
.diyas svg .fl{transform-origin:20px 17px;transition:opacity .3s}
.road{position:relative;height:170px;margin:4px -18px 8px;overflow:hidden}
.road::after{content:"";position:absolute;left:0;right:0;bottom:10px;height:3px;background:linear-gradient(90deg,transparent,#E6BD5F 20%,#FFF3C0 50%,#E6BD5F 80%,transparent);box-shadow:0 0 14px rgba(246,211,107,.8)}
.walk{position:absolute;bottom:8px;left:-40%;width:170px;animation:walk 5.2s linear forwards}
.walk img{width:100%;display:block;animation:bob .55s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
@keyframes walk{to{left:105%}}
@keyframes bob{50%{transform:translateY(-4px) rotate(-1deg)}}
.giftBig{width:110px;height:110px;margin:4px auto 0;display:block}
.giftBig.shake{animation:gshake .5s ease-in-out 3}
@keyframes gshake{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}.walk{left:50%;transform:translateX(-50%)}}
.daily .ic{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:12px;background:linear-gradient(180deg,#2E8A66,#0B3B2D);box-shadow:inset 0 0 0 2px var(--gold);font-size:24px}
.twrow{display:flex;align-items:center;gap:10px;margin:0 14px 6px;padding:8px 12px;border-radius:14px;text-decoration:none;color:var(--ivory);background:rgba(0,0,0,.22);box-shadow:inset 0 0 0 1.5px rgba(233,196,106,.45)}
.twrow .t{display:flex;gap:2px}.twrow .t i{width:12px;height:14px;border-radius:3px;background:#1B6B50;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}.twrow .t i:nth-child(2){background:var(--gold)}
.twrow span{flex:1;font-weight:700;font-size:15px}.twrow small{font-family:'DM Sans',sans-serif;font-weight:500;font-size:12.5px;color:rgba(255,248,234,.7)}
.cel .xp{font-family:'DM Sans',sans-serif;font-weight:700;font-size:13.5px;color:rgba(255,248,234,.8);margin:4px 0 2px}
#level.isDaily .bar .where b{color:var(--gold)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
 <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3C0"/><stop offset=".5" stop-color="#E9C46A"/><stop offset="1" stop-color="#B8862B"/></linearGradient>

<script>
/* Ambaro Word Puzzle: swipe letters on the brass wheel to fill the crossword.
   - 20 worlds x 15 levels and a daily puzzle, from levels.json (made by the level generator; every level was played
     through automatically before it shipped).
   - Progress (stars, gifts, daily streak, bonus pot) is kept on this phone and, when signed in, saved to the account
     (Supabase table game_saves, game_id "words") so it follows the player to a new phone.
   - Coins and XP go through the Ambaro wallet like every game: a finished level is rcReport("words","win"), the daily
     puzzle rcReport("words","daily"); hints add a "spend" event and the bonus pot / world Free gift an "earn" event
     (src/economy/rules.ts applyGames). The 6-try "Today's word" game lives in ./daily/. */
(function(){
'use strict';
const $=id=>document.getElementById(id);
const ELEPHANT='../brand/ambaro-elephant.webp', JOY='../sounds/animals/elephant-joy.mp3';
const HINT_COST=20, POT_SIZE=10, POT_PRIZE=25, GIFT=100, PAY={win:[25,50],daily:[50,60]};
const IST=5.5*3600e3, DAY=864e5, istDay=(t=Date.now())=>Math.floor((t+IST)/DAY), DAILY0=Math.floor(Date.UTC(2026,10,25)/DAY);
let WORLDS=[], DAILY=[], flat=[];

/* ---------- account and storage ---------- */
const raw={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const SB_URL=String(window.RC_SUPABASE_URL||''), SB_KEY=String(window.RC_SUPABASE_KEY||'');
const SB_STORE=SB_URL?'sb-'+SB_URL.replace(/^https:\/\//,'').split('.')[0]+'-auth-token':'';
function session(){try{const x=JSON.parse(raw.get(SB_STORE)||'null');return x&&x.access_token&&x.user&&!x.user.is_anonymous?x:null}catch(e){return null}}
const uid=()=>{const s=session();return s?s.user.id:null};
async function token(){
  let x=session();if(!x||!SB_URL)return null;
  if(!x.expires_at||x.expires_at*1000<Date.now()+60000){
    try{const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:x.refresh_token})});
      if(!r.ok)return null;const n=await r.json();if(!n.access_token)return null;if(!n.expires_at&&n.expires_in)n.expires_at=Math.floor(Date.now()/1000)+n.expires_in;raw.set(SB_STORE,JSON.stringify(n));x=n}catch(e){return null}}
  return x.access_token;
}
const blank=()=>({v:1,stars:{},gifts:{},jar:0,tut:false,daily:{},at:0});
const pkey=()=>'rc-words2:'+(uid()||'guest');
let P=load();
function load(){try{const x=JSON.parse(raw.get(pkey())||'null');return x&&x.v===1?Object.assign(blank(),x):blank()}catch(e){return blank()}}
function merge(a,b){const m=blank();m.tut=a.tut||b.tut;m.jar=(a.at>=b.at?a:b).jar;m.at=Math.max(a.at,b.at);
  for(const o of [a,b]){for(const k in o.stars)m.stars[k]=Math.max(m.stars[k]||0,o.stars[k]);for(const k in o.gifts)m.gifts[k]=1;for(const k in o.daily)m.daily[k]=Math.max(m.daily[k]||0,o.daily[k])}
  return m}
let saveTimer=null;
function save(){P.at=Date.now();raw.set(pkey(),JSON.stringify(P));clearTimeout(saveTimer);saveTimer=setTimeout(cloudSave,2500)}
async function cloudSave(){const u=uid(),t=await token();if(!u||!t)return;
  try{await fetch(SB_URL+'/rest/v1/game_saves?on_conflict=user_id,game_id,save_slot',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+t,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},
    body:JSON.stringify({user_id:u,game_id:'words',save_slot:'default',game_state:P,save_version:1,updated_at:new Date().toISOString()})})}catch(e){/* offline: saved next time */}}
async function cloudLoad(){const u=uid(),t=await token();if(!u||!t)return;
  try{const r=await fetch(SB_URL+'/rest/v1/game_saves?select=game_state&game_id=eq.words&save_slot=eq.default&user_id=eq.'+u,{headers:{apikey:SB_KEY,Authorization:'Bearer '+t}});
    if(!r.ok)return;const rows=await r.json();const g=rows[0]&&rows[0].game_state;
    if(g&&g.v===1){P=merge(P,Object.assign(blank(),g));raw.set(pkey(),JSON.stringify(P));if(!$('map').hidden)renderMap()}
    if(!g||JSON.stringify(g)!==JSON.stringify(P))cloudSave()}catch(e){}}

/* ---------- coins: the Ambaro wallet on this phone, plus games not yet collected by the home screen ---------- */
function pushEvent(e){try{const l=JSON.parse(raw.get('rc-game-events')||'[]');const list=Array.isArray(l)?l:[];list.push(e);raw.set('rc-game-events',JSON.stringify(list.slice(-50)))}catch(x){}}
function coinsNow(){
  let c=250;try{const w=JSON.parse(raw.get('rc-wallet:'+(uid()||'guest'))||'null');if(w&&typeof w.coins==='number')c=w.coins}catch(e){}
  try{const ev=JSON.parse(raw.get('rc-game-events')||'[]');if(Array.isArray(ev))ev.forEach(e=>{if(!e)return;if(e.r==='spend')c-=Number(e.c)||0;else if(e.r==='earn')c+=Number(e.c)||0;else if(PAY[e.r]&&e.g)c+=PAY[e.r][0];else if(e.r==='lose'||e.r==='done')c+=10;else if(e.r==='draw')c+=15})}catch(e){}
  return Math.max(0,c)}
const spend=n=>{if(coinsNow()<n)return false;pushEvent({g:'words',r:'spend',c:n,at:Date.now()});return true};
const earn=n=>pushEvent({g:'words',r:'earn',c:n,at:Date.now()});
const report=r=>{if(window.rcReport)window.rcReport('words',r);else pushEvent({g:'words',r,at:Date.now()})};

/* ---------- sound ---------- */
const quiet=()=>raw.get('rc-sound')==='off';
let ac;const NOTES=[523.25,587.33,659.25,783.99,880,1046.5,1174.66];
function ctx(){if(quiet())return null;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}return ac}
function tone(f,d=.25,v=.08,type='sine'){const a=ctx();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}
function bell(f,v=.07){tone(f,.6,v,'sine');tone(f*2.01,.35,v*.35,'sine')}
const arp=(fs,gap=80)=>fs.forEach((f,i)=>setTimeout(()=>bell(f),i*gap));
let joy;function elephantJoy(){if(quiet())return;try{joy=joy||new Audio(JOY);joy.currentTime=0;joy.volume=.8;joy.play().catch(()=>{})}catch(e){}}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function speak(w){try{const u=new SpeechSynthesisUtterance(w);u.lang='en-IN';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const canSpeak='speechSynthesis' in window&&typeof window.SpeechSynthesisUtterance==='function';

function toast(m,ms=1500){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),ms)}
function coins(bump){const n=coinsNow().toLocaleString('en-IN');document.querySelectorAll('.cn').forEach(e=>e.textContent=n);if(bump)document.querySelectorAll('.coin').forEach(c=>{c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump')})}
const starSvg=on=>`<svg class="${on?'':'off'}"><use href="#star"/></svg>`;
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- petals (the same marigold shower as Ludo) ---------- */
function petals(ms,count){
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv=document.createElement('canvas');cv.className='petals';document.body.appendChild(cv);
  const dpr=Math.min(2,devicePixelRatio||1),W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
  const r=(a,b)=>a+Math.random()*(b-a),C=['#ff9f1c','#ffb627','#f77f00','#ffd166','#e85d04','#fff4e0'];
  const ps=Array.from({length:reduced?Math.round(count/3):count},()=>({x:r(0,W),y:r(-H*.9,-10),vy:r(1,2.4),sw:r(.6,1.6),ph:r(0,6.3),rt:r(0,6.3),sp:r(-.05,.05),w:r(5,9),h:r(3,5.5),c:C[Math.floor(Math.random()*6)]}));
  const t0=performance.now();
  (function f(now){const t=now-t0;g.clearRect(0,0,W,H);const fade=t>ms-700?Math.max(0,(ms-t)/700):1;
    for(const p of ps){p.y+=p.vy;p.ph+=.03;p.x+=Math.sin(p.ph)*p.sw;p.rt+=p.sp;g.save();g.globalAlpha=fade;g.translate(p.x,p.y);g.rotate(p.rt);g.fillStyle=p.c;g.beginPath();g.ellipse(0,0,p.w,p.h,0,0,7);g.fill();g.fillStyle='rgba(120,50,0,.25)';g.beginPath();g.ellipse(-p.w*.35,0,p.w*.3,p.h*.3,0,0,7);g.fill();g.restore()}
    if(t<ms)requestAnimationFrame(f);else cv.remove()})(t0);
}

/* ================= map ================= */
const key=i=>flat[i].wi+'-'+flat[i].li;
const upTo=()=>{let i=0;while(i<flat.length&&P.stars[key(i)])i++;return i};
const today=()=>istDay()-DAILY0;
const dailyLevel=()=>DAILY[((today()%DAILY.length)+DAILY.length)%DAILY.length];
function dailyStreak(){let n=0,d=today();if(!P.daily[d])d--;while(P.daily[d]){n++;d--}return n}
function shade(hex,a){const n=parseInt(hex.slice(1),16);const c=x=>Math.max(0,Math.min(255,x+a));return '#'+((c(n>>16)<<16)|(c((n>>8)&255)<<8)|c(n&255)).toString(16).padStart(6,'0')}
function renderMap(){
  const up=upTo();let idx=0;const parts=[];
  const got=Object.values(P.stars).reduce((a,b)=>a+b,0);
  $('starTotal').textContent=`${got} of ${flat.length*3} stars`;
  const dd=P.daily[today()],st=dailyStreak();
  $('dailyTxt').innerHTML=dd?`Done for today${st>1?` · 🔥 ${st}-day streak`:''}`:`A bigger puzzle every day${st?` · 🔥 ${st}`:''}`;
  $('dailyBtn').textContent=dd?'Play again':'Play';
  WORLDS.forEach((w,wi)=>{
    const first=idx,n=w.levels.length,locked=first>up,step=96,H=n*step+90;
    if(first>up+15){idx+=n;parts.push(`<div class="world locked" style="--wc:${w.color};--wcd:${shade(w.color,-70)}"><div class="wband"><span class="em" aria-hidden="true">${w.emoji}</span><b>${esc(w.name)}</b><span><svg><use href="#lock"/></svg></span></div></div>`);return}
    const X=[50,74,58,30,44,70,36];
    const pts=w.levels.map((_,li)=>[X[li%X.length],H-50-li*step]);
    const giftY=H-50-n*step+20;
    let d=`M ${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],my=(a[1]+b[1])/2;d+=` C ${a[0]} ${my}, ${b[0]} ${my}, ${b[0]} ${b[1]}`}
    const ws=w.levels.reduce((a,_,li)=>a+(P.stars[wi+'-'+li]||0),0);
    let h=`<div class="world ${locked?'locked':''}" style="--wc:${w.color};--wcd:${shade(w.color,-70)}">
      <div class="wband"><span class="em" aria-hidden="true">${w.emoji}</span><b>${esc(w.name)}</b><span>${locked?'<svg><use href="#lock"/></svg>':`<svg><use href="#star"/></svg>${ws}/${n*3}`}</span></div>
      <div class="path" style="height:${H}px"><svg class="road" viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="rgba(233,196,106,.45)" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 14" vector-effect="non-scaling-stroke"/></svg>`;
    w.levels.forEach((l,li)=>{const i=idx++,s=P.stars[wi+'-'+li]||0,cls=i<up?'done':i===up?'current':'locked',[x,y]=pts[li];
      h+=`<button class="node ${cls}" style="left:${x}%;top:${y}px" data-i="${i}" type="button" aria-label="Level ${li+1}, ${esc(l.title)}${cls==='locked'?', locked':s?`, ${s} stars`:''}">${cls==='locked'?'<svg><use href="#lock"/></svg>':li+1}${i===up?`<span class="nm">${esc(l.title)}</span>`:''}${cls==='done'?`<span class="st">${[1,2,3].map(k=>starSvg(k<=s)).join('')}</span>`:''}</button>`});
    h+=`<div class="gift ${P.gifts[wi]?'done':''}" style="left:50%;top:${giftY}px" role="img" aria-label="Free gift for finishing ${esc(w.name)}"><svg><use href="#giftbox"/></svg></div></div></div>`;
    parts.push(h);
  });
  $('worlds').innerHTML=parts.reverse().join('');coins();
  const cur=document.querySelector('.node.current');if(cur)setTimeout(()=>cur.scrollIntoView({block:'center'}),50);
}
$('worlds').addEventListener('click',e=>{const n=e.target.closest('.node');if(!n)return;if(n.classList.contains('locked')){toast('Finish the level before this one first');return}ctx();openLevel(+n.dataset.i)});
$('dailyBtn').onclick=()=>{ctx();openDaily()};

/* ================= level ================= */
let cur,found,bonus,hints,letters,sel,drag,done,streak,lastFind,tip,CS,PL,revealed;
const ck=(r,c)=>r+','+c;
const cellsOf=w=>Array.from(w.w,(_,i)=>w.d==='H'?[w.r,w.c+i]:[w.r+i,w.c]);
const cellEl=(r,c)=>document.querySelector(`.cell[data-k="${ck(r,c)}"]`);
function start(c){
  cur=c;found=new Set();bonus=new Set();hints=0;sel=[];drag=false;done=false;streak=0;lastFind=0;revealed=[];
  letters=shuffle(cur.l.base.split(''));
  $('map').hidden=true;$('level').hidden=false;$('level').classList.toggle('isDaily',!!cur.daily);
  layout();updProg();updPot();coins();
}
function openLevel(i){const f=flat[i];$('lvWorld').textContent=f.w.name;$('lvNo').textContent=`Level ${f.li+1} of ${f.w.levels.length}`;start({i,...f});if(!P.tut&&i===0)setTimeout(tutorial,500)}
function openDaily(){const l=dailyLevel();$('lvWorld').textContent='Daily puzzle';$('lvNo').textContent=new Date(istDay()*DAY).toLocaleDateString('en-IN',{timeZone:'UTC',day:'numeric',month:'long'});
  start({daily:true,i:-1,wi:-1,li:-1,w:{name:'Daily puzzle',levels:[l]},l})}
function shuffle(a){a=a.slice();for(let k=0;k<6;k++){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}if(a.join('')!==cur.l.base)break}return a}
function layout(){
  const vh=innerHeight,vw=Math.min(innerWidth,560);
  PL=Math.round(Math.max(200,Math.min(vw-150,vh*.36,380)));
  const p=$('plate');p.style.width=PL+'px';p.style.height=PL+'px';
  $('deck').style.minHeight=PL+40+'px';
  requestAnimationFrame(()=>{
    const [R,C]=cur.l.size,box=$('trayWrap').getBoundingClientRect();
    CS=Math.floor(Math.max(28,Math.min(innerWidth>=700?84:64,(box.width-56)/C,(box.height-40)/R)));
    const g=$('grid');g.style.width=C*CS+'px';g.style.height=R*CS+'px';g.innerHTML='';
    const seen={};
    cur.l.words.forEach(w=>cellsOf(w).forEach(([r,c],k)=>{const id=ck(r,c);if(seen[id])return;seen[id]=1;
      const d=document.createElement('div');d.className='cell';d.dataset.k=id;Object.assign(d.style,{left:c*CS+3+'px',top:r*CS+3+'px',width:CS-6+'px',height:CS-6+'px',fontSize:CS*.56+'px'});
      d.innerHTML=`<span>${w.w[k]}</span>`;g.appendChild(d)}));
    cur.l.words.forEach(w=>{if(found.has(w.w))cellsOf(w).forEach(([r,c])=>cellEl(r,c).classList.add('on'))});
    revealed.forEach(id=>{const e=document.querySelector(`.cell[data-k="${id}"]`);if(e&&!e.classList.contains('on'))e.classList.add('hint')});
    placeTokens(false);
  });
}
addEventListener('resize',()=>{if(!$('level').hidden&&cur)layout()});
function tokPos(i){const n=letters.length,a=-Math.PI/2+i*2*Math.PI/n,rad=PL*(n<=4?.29:n===5?.31:n===6?.32:.33);return [PL/2+rad*Math.cos(a),PL/2+rad*Math.sin(a)]}
function placeTokens(animate){
  // A new level starts from a clean wheel; a shuffle moves the same discs to their new places.
  const p=$('plate'),size=Math.round(PL*(letters.length>=7?.2:letters.length===6?.22:.25));
  let toks=[...p.querySelectorAll('.tok')];
  if(!animate||toks.length!==letters.length){toks.forEach(t=>t.remove());toks=letters.map(ch=>{const t=document.createElement('div');t.className='tok';t.dataset.ch=ch;t.textContent=ch;p.appendChild(t);return t})}
  const pool=toks.slice();
  letters.forEach((ch,i)=>{const k=pool.findIndex(t=>t.dataset.ch===ch);const t=pool.splice(k,1)[0];t.dataset.i=i;const [x,y]=tokPos(i);
    Object.assign(t.style,{width:size+'px',height:size+'px',marginLeft:-size/2+'px',marginTop:-size/2+'px',fontSize:size*.56+'px',left:x+'px',top:y+'px'});
    if(!animate){t.style.transition='none';void t.offsetWidth;t.style.transition=''}});
  sel=[];drawTrail();
}
function hit(px,py){const r=$('plate').getBoundingClientRect(),x=px-r.left,y=py-r.top,rad=PL*(letters.length>=7?.105:.12);for(let i=0;i<letters.length;i++){const [lx,ly]=tokPos(i);if(Math.hypot(lx-x,ly-y)<rad)return i}return -1}
function drawTrail(){
  const pts=sel.map(tokPos);if(tip&&sel.length)pts.push(tip);const s=pts.map(p=>p.join(',')).join(' ');
  $('trail').innerHTML=pts.length>1?`<defs><filter id="gl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter></defs>
   <polyline points="${s}" fill="none" stroke="#FFB627" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity=".55" filter="url(#gl)"/>
   <polyline points="${s}" fill="none" stroke="#F28C28" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
   <polyline points="${s}" fill="none" stroke="#FFE29A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 9"/>`:'';
  document.querySelectorAll('#plate .tok').forEach(t=>t.classList.toggle('sel',sel.includes(+t.dataset.i)));
  const b=$('bub');b.className='';b.innerHTML=sel.map(i=>`<b>${letters[i]}</b>`).join('');
}
function add(i){if(i<0)return;const k=sel.indexOf(i);
  if(k===-1){sel.push(i);tone(NOTES[Math.min(sel.length-1,6)],.3,.08,'triangle');buzz(8)}
  else if(k===sel.length-2){sel.pop();tone(392,.12,.04)}
  drawTrail()}
const plate=$('plate');
plate.addEventListener('pointerdown',e=>{if(done)return;ctx();stopTutorial();const i=hit(e.clientX,e.clientY);if(i<0)return;drag=true;plate.setPointerCapture(e.pointerId);sel=[];add(i)});
plate.addEventListener('pointermove',e=>{if(!drag)return;const r=plate.getBoundingClientRect();tip=[e.clientX-r.left,e.clientY-r.top];add(hit(e.clientX,e.clientY));drawTrail()});
const up=()=>{if(!drag)return;drag=false;tip=null;submit()};
plate.addEventListener('pointerup',up);plate.addEventListener('pointercancel',up);
document.addEventListener('keydown',e=>{if($('level').hidden||done||document.querySelector('.cel.show'))return;
  if(e.key==='Enter'){submit();return}if(e.key==='Backspace'){sel.pop();drawTrail();return}
  if(/^[a-z]$/i.test(e.key)){const ch=e.key.toLowerCase(),i=letters.findIndex((c,j)=>c===ch&&!sel.includes(j));if(i>=0)add(i)}});

function clearBub(ms){setTimeout(()=>{if(!sel.length){$('bub').innerHTML='';$('bub').className=''}},ms)}
function submit(){
  const word=sel.map(i=>letters[i]).join(''),bubTiles=[...$('bub').children];
  sel=[];document.querySelectorAll('#plate .tok').forEach(t=>t.classList.remove('sel'));$('trail').innerHTML='';
  if(word.length<3){$('bub').innerHTML='';return}
  const t=cur.l.words.find(x=>x.w===word);
  if(t){
    if(found.has(word)){$('bub').className='dup';cellsOf(t).forEach(([r,c])=>{const e=cellEl(r,c);e.classList.remove('again');void e.offsetWidth;e.classList.add('again')});toast('Already found');clearBub(600);return}
    found.add(word);flyTo(bubTiles,cellsOf(t).map(([r,c])=>cellEl(r,c)),()=>landWord(t));
    const now=performance.now();streak=(now-lastFind<9000)?streak+1:1;lastFind=now;
    if(streak>=2)praise(['','','Good!','Great!','Excellent!','Brilliant!'][Math.min(streak,5)]);
    updProg();if(found.size===cur.l.words.length){done=true;setTimeout(complete,950)}
    return;
  }
  if(cur.l.bonus.includes(word)){
    if(bonus.has(word)){$('bub').className='dup';toast('Already in your bonus pot');clearBub(600);return}
    bonus.add(word);P.jar++;flyTo(bubTiles,[$('potBtn').querySelector('.r')],()=>{updPot();arp([987.77,1318.5],90);buzz(15)});toast('Bonus word!');
    if(P.jar>=POT_SIZE){P.jar=0;earn(POT_PRIZE);setTimeout(()=>{updPot();coins(true);toast(`Bonus pot full: +${POT_PRIZE} lotus coins`);arp([783.99,987.77,1174.66,1567.98],90)},800)}
    save();return;
  }
  $('bub').className='bad';tone(220,.18,.05,'triangle');buzz(30);streak=0;clearBub(450);
}
function flyTo(tiles,targets,after){
  if(!tiles.length){after();return}
  tiles.forEach((src,k)=>{const a=src.getBoundingClientRect(),tg=targets[Math.min(k,targets.length-1)],b=tg.getBoundingClientRect();
    const f=document.createElement('div');f.className='flyer';f.textContent=src.textContent;Object.assign(f.style,{left:a.left+'px',top:a.top+'px',width:a.width+'px',height:a.height+'px'});
    document.body.appendChild(f);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.transitionDelay=k*45+'ms';f.style.transform=`translate(${b.left-a.left+(b.width-a.width)/2}px,${b.top-a.top+(b.height-a.height)/2}px)`;if(targets.length===1)f.style.opacity='0'}));
    setTimeout(()=>f.remove(),480+k*45)});
  $('bub').innerHTML='';setTimeout(after,420);
}
function landWord(t){cellsOf(t).forEach(([r,c],k)=>{const e=cellEl(r,c);setTimeout(()=>{e.classList.remove('hint');e.classList.add('on','glow');tone(NOTES[Math.min(k,6)]*2,.22,.05);setTimeout(()=>e.classList.remove('glow'),650)},k*60)});
  setTimeout(()=>arp([523.25,659.25,783.99],70),60);buzz(20)}
function praise(txt){const d=document.createElement('div');d.className='praise';d.textContent=txt;$('trayWrap').appendChild(d);setTimeout(()=>d.remove(),1150)}
function updProg(){const n=cur.l.words.length;$('prog').innerHTML=Array.from({length:n},(_,k)=>`<i class="${k<found.size?'on':''}"></i>`).join('')+`<span>${found.size} of ${n} words</span>`}
function updPot(){$('potN').textContent=P.jar;$('potFill').style.height=P.jar*(100/POT_SIZE)+'%'}
$('shufBtn').onclick=()=>{if(done)return;letters=shuffle(letters);placeTokens(true);tone(440,.12,.05);tone(554,.12,.04)};
$('potBtn').onclick=()=>toast(bonus.size?`Bonus words: ${[...bonus].join(', ')}`:`Real words that aren't in the grid go here. ${POT_SIZE} fill the pot for ${POT_PRIZE} coins.`,2200);
$('hintBtn').onclick=()=>{
  if(done)return;const empty=[...document.querySelectorAll('.cell:not(.on):not(.hint)')];if(!empty.length)return;
  if(!spend(HINT_COST)){toast(`You need ${HINT_COST} lotus coins for a hint`);return}
  hints++;coins(true);
  const e=empty[Math.floor(Math.random()*empty.length)];e.classList.add('hint');revealed.push(e.dataset.k);bell(1046.5);
  cur.l.words.forEach(w=>{if(!found.has(w.w)&&cellsOf(w).every(([r,c])=>{const x=cellEl(r,c);return x.classList.contains('on')||x.classList.contains('hint')})){found.add(w.w);cellsOf(w).forEach(([r,c])=>cellEl(r,c).classList.add('on'))}});
  updProg();if(found.size===cur.l.words.length){done=true;setTimeout(complete,700)}
};
function toMap(){stopTutorial();$('level').hidden=true;$('map').hidden=false;renderMap()}
$('lvBack').onclick=toMap;

/* first-time tutorial: a hand traces the first word */
let tutTimer=null;
function tutorial(){
  const w=cur.l.words[0].w,deck=$('deck');const order=[];const used=new Set();
  for(const ch of w){const i=letters.findIndex((c,j)=>c===ch&&!used.has(j));used.add(i);order.push(i)}
  const tipEl=document.createElement('div');tipEl.className='tip';tipEl.id='tutTip';tipEl.textContent='Swipe across the letters to make a word';deck.appendChild(tipEl);
  const hand=document.createElement('div');hand.className='hand';hand.id='tutHand';hand.innerHTML='<svg viewBox="0 0 64 64" width="54" height="54"><use href="#hand"/></svg>';deck.appendChild(hand);
  let k=0;
  const go=()=>{const pr=$('plate').getBoundingClientRect(),dr=deck.getBoundingClientRect();const [x,y]=tokPos(order[k%order.length]);hand.style.transition=k%order.length===0?'none':'left .55s ease,top .55s ease';hand.style.left=pr.left-dr.left+x-12+'px';hand.style.top=pr.top-dr.top+y-6+'px';k++;tutTimer=setTimeout(go,k%order.length===0?1100:600)};
  go();
}
function stopTutorial(){clearTimeout(tutTimer);['tutTip','tutHand'].forEach(id=>{const e=$(id);if(e)e.remove()});if(!P.tut){P.tut=true;save()}}

/* ================= celebrations ================= */
function complete(){
  stopTutorial();
  const stars=hints===0?3:hints===1?2:1;
  let sub,result='win';
  if(cur.daily){const d=today();result=P.daily[d]?'':'daily';P.daily[d]=Math.max(P.daily[d]||0,stars);const s=dailyStreak();sub=`Daily puzzle complete${s>1?` · 🔥 ${s}-day streak`:''}`}
  else{const k=cur.wi+'-'+cur.li;P.stars[k]=Math.max(P.stars[k]||0,stars);sub=`${cur.w.name}, level ${cur.li+1} complete`}
  save();if(result)report(result);
  const earnN=result?PAY[result][0]:0;
  $('celTitle').textContent=['Well done!','Great job!','Wonderful!'][stars-1];
  $('celSub').textContent=sub;
  $('stars').innerHTML=[1,2,3].map(n=>`<svg class="s${n} ${n<=stars?'got':'off'}"><use href="#star"/></svg>`).join('');
  $('earnN').textContent='+0';$('xpN').textContent=result?`+${PAY[result][1]} XP`:'Already played today';
  const L=cur.l.learn;$('wcard').innerHTML=L?`<div class="tag">Word of the level</div><div class="w">${esc(L.w)}${canSpeak?`<button class="say" type="button" data-say="${esc(L.w)}" aria-label="Hear ${esc(L.w)}"><svg><use href="#speaker"/></svg></button>`:''}</div><p>${esc(L.mean)}.</p><p class="ex">“${esc(L.ex)}”</p>`:'';
  $('wcard').hidden=!L;
  $('chips').innerHTML=cur.l.words.map(w=>`<span>${w.w}</span>`).join('')+[...bonus].map(w=>`<span class="b">${w}</span>`).join('');
  const lastOfWorld=!cur.daily&&cur.li===cur.w.levels.length-1;
  $('nextBtn').textContent=cur.daily?'Back to the map':lastOfWorld?'Continue':cur.i>=flat.length-1?'Back to the map':'Next level';
  $('toMap').hidden=!!cur.daily;
  $('celLevel').classList.add('show');$('nextBtn').focus({preventScroll:true});
  petals(3200,120);
  [...$('stars').children].forEach((s,n)=>setTimeout(()=>{s.classList.add('in');if(n<stars){bell([783.99,987.77,1174.66][n],.09);buzz(25)}},380+n*330));
  let shown=0;const tick=earnN&&setInterval(()=>{shown=Math.min(earnN,shown+Math.ceil(earnN/14));$('earnN').textContent='+'+shown;if(shown>=earnN){clearInterval(tick);coins(true)}},55);
}
document.addEventListener('click',e=>{const s=e.target.closest('[data-say]');if(s)speak(s.dataset.say)});
function afterLevel(){
  if(cur.daily){toMap();return}
  if(cur.li===cur.w.levels.length-1&&!P.gifts[cur.wi]){worldDone();return}
  if(cur.i<flat.length-1&&cur.li<cur.w.levels.length-1)openLevel(cur.i+1);else toMap();
}
$('nextBtn').onclick=()=>{$('celLevel').classList.remove('show');afterLevel()};
$('toMap').onclick=()=>{$('celLevel').classList.remove('show');if(cur.li===cur.w.levels.length-1&&!P.gifts[cur.wi]){worldDone();return}toMap()};

function worldDone(){
  const w=cur.w;$('wTitle').textContent=`${w.name} complete!`;$('wSub').textContent=`All ${w.levels.length} levels done`;
  $('diyas').innerHTML=Array.from({length:5},()=>`<svg viewBox="0 0 40 36"><use href="#diya"/></svg>`).join('');
  $('road').innerHTML=`<div class="walk"><img src="${ELEPHANT}" alt="The Ambaro elephant carrying its ambari"></div>`;
  $('giftBig').classList.remove('shake');$('openGift').hidden=false;$('wDone').hidden=true;
  $('celWorld').classList.add('show');
  [...$('diyas').children].forEach((d,i)=>setTimeout(()=>{d.classList.add('lit');bell(659.25+i*110,.06)},500+i*420));
  setTimeout(()=>{elephantJoy();petals(5200,150)},900);
  setTimeout(()=>$('giftBig').classList.add('shake'),2800);
}
$('openGift').onclick=()=>{if(!P.gifts[cur.wi]){P.gifts[cur.wi]=1;earn(GIFT);save()}coins(true);arp([523.25,659.25,783.99,1046.5,1318.5],90);petals(2500,90);
  $('wSub').textContent=`Free gift: +${GIFT} lotus coins`;$('openGift').hidden=true;$('wDone').hidden=false;$('wDone').textContent=cur.wi<WORLDS.length-1?`On to ${WORLDS[cur.wi+1].name}`:'Back to the map';$('wDone').focus()};
$('wDone').onclick=()=>{$('celWorld').classList.remove('show');if(cur.i<flat.length-1)openLevel(cur.i+1);else toMap()};

/* Android back button: close a celebration or leave the level before leaving the game. */
addEventListener('popstate',()=>{});

/* ================= start ================= */
fetch('levels.json').then(r=>r.json()).then(d=>{
  WORLDS=d.worlds;DAILY=d.daily;flat=[];WORLDS.forEach((w,wi)=>w.levels.forEach((l,li)=>flat.push({wi,li,w,l})));
  renderMap();cloudLoad();
}).catch(()=>{$('worlds').innerHTML='<div class="soon">Could not load the puzzles. Check your connection and open Word Puzzle again.</div>'});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)coins()});
})();
</script>
