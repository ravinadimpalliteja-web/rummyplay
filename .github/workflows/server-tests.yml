name: Room server tests

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-tests.yml"

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
