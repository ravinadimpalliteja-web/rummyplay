name: Royal Club web build

on:
  push:
    branches: [royal-club-portal]
    paths:
      - "web/**"
      - ".github/workflows/royal-club-web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/royal-club-web.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
