name: Rummy engine tests
on:
  push:
    branches:
      - royal-club-brand-preview
  pull_request:
    branches:
      - main
jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Rummy rules regression tests
        run: node --test tests/rummy-engine.test.js
